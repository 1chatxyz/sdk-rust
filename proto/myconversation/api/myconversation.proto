  double avg_pct                           = 2;  // 0-100 vs criterion max
}

// One ISO week bucket for staff score trend charts (Monday 00:00 UTC).
message QAEvaluationScoreTrendPoint {
  google.protobuf.Timestamp week_start = 1;
  double avg_score                     = 2;
  int64 conversations_evaluated        = 3;
}

message QAEvaluationStaffScoreInfo {
  int64 user_id                 = 1;
  string display_name           = 2;
  int64 conversations_evaluated = 3;
  int32 critical_error_count    = 4;
  double avg_score              = 5;
  // Absolute point difference vs the previous equal-length period (avg_score_cur - avg_score_prev).
  // 0 when the previous period has no evaluations for this staff member.
  double score_change           = 6;
  model.v1.QAEvaluationRatingTier rating_tier = 7;
  int64 conversations_total                   = 8;  // eligible in window (for sample %)
  double csat_satisfied_rate                  = 9;  // satisfied / (satisfied+neutral+dissatisfied)
  int64 csat_response_count                   = 10;
  int64 csat_eligible_count                   = 11;  // conversations in window with opportunity
  bool sample_too_small                       = 12;  // evaluated/total < 10% when total >= 10
  bool qa_csat_skew_high_qa_low_csat          = 13;
  bool qa_csat_skew_low_qa_high_csat          = 14;
  repeated QAEvaluationCriterionAvg criteria_avgs = 15;
  int32 money_penalty_total                   = 16;
  // Last 6 completed ISO weeks ending at the filter window `to` (oldest → newest).
  repeated QAEvaluationScoreTrendPoint score_trend = 17;
}

