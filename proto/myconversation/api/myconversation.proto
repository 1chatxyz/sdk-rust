// ── QA evaluation (helpdesk EXTERNAL+TELEGRAM; chat history via ListMessages / GetConversation) ──

message QAEvaluationFilter {
  DashboardTimeRange time_range = 1;
  repeated int64 cs_user_ids = 2 [(validate.rules).repeated = { max_items: 100, unique: true,
                                                                 items: { int64: { gt: 0 } } }];
  model.v1.QAEvaluationStatus status_filter = 3 [(validate.rules).enum = { defined_only: true }];
  string search_query = 4 [(validate.rules).string = { ignore_empty: true, max_len: 256 }];
  // Default UNSPECIFIED = ACTIVITY (legacy). Set EVALUATED_AT so List matches Ranking counts.
  model.v1.QAEvaluationWindowBy window_by = 5 [(validate.rules).enum = { defined_only: true }];
  reserved 6;
  reserved "business_categories";
  repeated model.v1.QAEvaluationSelectionReason selection_reasons = 7 [(validate.rules).repeated = {
    max_items: 10, unique: true, items: { enum: { defined_only: true } }
  }];
  // AND filter: conversation.labels JSON must contain each catalog label id.
  repeated int64 label_ids = 8 [(validate.rules).repeated = { max_items: 20, unique: true,
                                                               items: { int64: { gt: 0 } } }];
}

message GetQAEvaluationRubricRequest {}

message QAEvaluationCriterionDef {
  model.v1.QAEvaluationCriterion criterion = 1;
  string title                             = 2;
  string description                       = 3;
  int32 max_score                          = 4;
  repeated int32 allowed_scores            = 5;
}

message QAEvaluationCriticalErrorDef {
  model.v1.QAEvaluationCriticalError error = 1;
  string title                             = 2;
  string description                       = 3;
  // Legacy point deduction (negative in reply for display, e.g. -5). Still used when use_money_penalty=false.
  int32 deduction                          = 4;
  // Monetary penalty in nghìn VND (k), e.g. 300 = 300k. Used when use_money_penalty=true.
  int32 money_penalty                      = 5;
}

message QAEvaluationRatingTierDef {
  model.v1.QAEvaluationRatingTier tier = 1;
  string label                         = 2;
  int32 min_score                      = 3;
  int32 max_score                      = 4;
}

message GetQAEvaluationRubricReply {
  repeated QAEvaluationCriterionDef criteria      = 1;
  repeated QAEvaluationCriticalErrorDef errors    = 2;
  repeated QAEvaluationRatingTierDef rating_tiers = 3;
}

message ListQAEvaluationConversationsRequest {
  QAEvaluationFilter filter = 1;
  int32 page_size           = 2;
  int32 page                = 3;
}

message QAEvaluationConversationItem {
  int64 conversation_id                   = 1;
  string external_id                      = 2;
  string customer_name                    = 3;
  int64 cs_user_id                        = 4;
  string cs_display_name                  = 5;
  google.protobuf.Timestamp last_message_at = 6;
  model.v1.QAEvaluationStatus status      = 7;
  int32 total_score                       = 8;
  // Concatenated content of the first and second customer messages (space-separated).
  string first_messages_content           = 9;
  // Customer satisfaction rating submitted by the player for this conversation; UNSPECIFIED when none.
  model.v1.CustomerSentiment satisfaction = 10;
  // Total number of messages in this conversation.
  int64 message_count                     = 11;
  model.v1.Platform platform                = 12;
  // Latest non-empty CUSTOMER message preview (updates when customer writes again).
  string latest_customer_preview          = 13;
  reserved 14;
  reserved "business_category";
  model.v1.QAEvaluationSelectionReason selection_reason   = 15;
  model.v1.QAEvaluationRatingTier rating_tier             = 16;
  bool stale                                              = 17;  // evaluated but invalidated by newer customer traffic
  int32 money_penalty                                     = 18;
  int32 criteria_total                                    = 19;
  // Conversation.labels (same shape as ListConversations).
  repeated LabelInfo labels                               = 20;
}

message ListQAEvaluationConversationsReply {
  repeated QAEvaluationConversationItem conversations = 1;
  int32 page_size                                   = 2;
  int32 page                                        = 3;
  int64 count                                       = 4;
  int64 pending_count                               = 5;
  // Progress counters for the same filter scope as `count` (after status/staff/search).
  int64 evaluated_count                             = 6;
  int64 total_eligible                              = 7;
}

