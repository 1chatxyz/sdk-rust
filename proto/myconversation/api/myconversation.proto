message MessageReaction {
  int64 id = 1 [(validate.rules).int64 = { gt: 0 }];
  // myid user for USER reactors; 0 when reactor_kind = TELEGRAM_GUEST.
  int64 user_id = 2 [(validate.rules).int64 = { gte: 0 }];
  string emoji  = 3 [(validate.rules).string = { min_len: 1, max_len: 64 }];
  // USER = staff (default); TELEGRAM_GUEST = inbound bridge attribution only.
  model.v1.ChatGroupMessageSenderKind reactor_kind = 4;
  // Telegram user id when reactor_kind = TELEGRAM_GUEST; 0 for USER.
  int64 external_reactor_id = 5;
  // Display name / @username / avatar hydrated from chat_group_telegram_guests for guests.
  string external_display_name = 6 [(validate.rules).string = { ignore_empty: true, max_len: 256 }];
  string external_username     = 7 [(validate.rules).string = { ignore_empty: true, max_len: 128 }];
  string external_avatar_url   = 8 [(validate.rules).string = { ignore_empty: true, max_len: 2048 }];
}

message ChatGroupMessageInfo {
  int64 id                             = 1;
  int64 group_id                       = 2;
  int64 sender_user_id                 = 3;
  string sender_username               = 4;
  string content                       = 5;
  repeated string images               = 6;
  repeated string videos               = 7;
  repeated string files                = 8;
  repeated int64 mentioned_user_ids    = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp edited_at  = 11;
  google.protobuf.Timestamp deleted_at = 12;
  // 0 = main channel; > 0 = topic thread.
  int64 topic_id = 13;
  // Per-member delivery ACKs (receipt = xác nhận đã nhận/đã đọc, not biên lai thanh toán).
  // Active anonymous members never appear in these lists/counts for any viewer (owner/admin included).
  // Anonymous members still ACK via MarkChatGroupRead / MarkChatGroupReceived; unread clears via RPC reply.
  int64 received_count                    = 14;
  int64 read_count                        = 15;
  repeated int64 received_by_user_ids     = 16;
  repeated int64 read_by_user_ids         = 17;
  ChatGroupDeliveryStatus delivery_status = 18;
  ChatGroupMessageInfo reply_to           = 19;
  // 0 = top-level; on thread replies, the parent message id.
  int64 message_thread_root_id = 20;
  // Set on top-level messages when reply_count > 0.
  MessageThreadSummary message_thread = 21;
  // Resolved from mysticker at send time so the UI can render without an extra call.
  // sticker_url may be empty if lookup failed; sticker_id is always preserved when set.
  int64 sticker_id   = 22;
  string sticker_url = 23 [(validate.rules).string = { ignore_empty: true, max_len: 2048 }];
  repeated MessageReaction reactions   = 24;
  repeated LinkPreview link_previews   = 25;
  bool pinned                          = 26;
  google.protobuf.Timestamp pinned_at  = 27;
  int64 pinned_by_user_id              = 28;
  // Set when this message forwards a shared snapshot (see ShareMessage / GetSharedMessage).
  string shared_message_hash = 29 [(validate.rules).string = { ignore_empty: true, min_len: 1, max_len: 64 }];
  // Excerpt from the parent message when the reply quotes a substring; empty when not a quote-reply.
  string reply_quote_text = 30 [(validate.rules).string = { max_len: 4096 }];
  // UTF-16 code-unit offset of reply_quote_text within the parent message content; 0 when not set.
  int32 reply_quote_position = 31 [(validate.rules).int32 = { gte: 0 }];
  // Original name/size per uploaded file (matched to `files` by URL).
  repeated FileMeta file_metas = 32;
  // True when the sender targeted @all (active members at send/edit time).
  // When true, mentioned_user_ids is omitted on the wire; clients render @all from this flag.
  bool mentions_all = 33;
  // Snapshot at send time. When true, wire hydrate always sets sender_user_id=0 and
  // sender_username to the group name (main) or topic name (thread); nobody (including
  // owner/admin/self) sees the real author on the wire.
  bool sender_anonymous = 34;
  // USER = tenant staff (default); TELEGRAM_GUEST = inbound bridge attribution only.
  model.v1.ChatGroupMessageSenderKind sender_kind = 35;
  // Telegram user id when sender_kind = TELEGRAM_GUEST; omitted for USER.
  int64 external_sender_id = 36;
  // Display name snapshot for TELEGRAM_GUEST (first/last or @username fallback).
  string external_display_name = 37 [(validate.rules).string = { ignore_empty: true, max_len: 256 }];
  // Telegram @username without @ when sender_kind = TELEGRAM_GUEST.
  string external_username = 38 [(validate.rules).string = { ignore_empty: true, max_len: 128 }];
  // Hydrated from chat_group_telegram_guests (R2-rehosted profile photo). Empty when
  // unknown, EMPTY, or ERROR — FE falls back to a generic Telegram guest icon.
  // Absolute when media URL prefix is configured; otherwise relative R2 object key.
  string external_avatar_url = 39 [(validate.rules).string = { ignore_empty: true, max_len: 2048 }];
  // Telegram guest mention targets (bridged rooms only). Never myid users; not GC-03.
  repeated int64 mentioned_telegram_user_ids = 40 [(validate.rules).repeated = {
    max_items: 100,
    unique: true,
    items: { int64: { gt: 0 } }
  }];
  // Telegram bridge voice notes (ogg/opus URLs); distinct from generic files.
  repeated string voices = 41;
  // True when this thread reply was also projected onto the parent channel/topic timeline
  // at send time (same message id). Only meaningful when message_thread_root_id > 0.
  bool also_sent_to_timeline = 42;
  // Caller's Later save status for this message. UNSPECIFIED = not saved by the caller.
  // Nested reply_to is left UNSPECIFIED (only top-level page rows are enriched).
  SavedMessageStatus saved_status = 43;
}

// Aggregate tick for the sender UI: sent → received (ACK) → read.
enum ChatGroupDeliveryStatus {
  CHAT_GROUP_DELIVERY_STATUS_UNSPECIFIED = 0;
  CHAT_GROUP_DELIVERY_STATUS_SENT        = 1;
  CHAT_GROUP_DELIVERY_STATUS_RECEIVED    = 2;
  CHAT_GROUP_DELIVERY_STATUS_READ        = 3;
}

message SendChatGroupMessageRequest {
  int64 group_id                    = 1 [(validate.rules).int64 = { gt: 0 }];
  string content                    = 2 [(validate.rules).string = { max_len: 4096 }];
  repeated string images            = 3 [(validate.rules).repeated = { max_items: 10,
                                                                       items: { string: { max_len: 2048 } } }];
  repeated string videos            = 4 [(validate.rules).repeated = { max_items: 10,
                                                                       items: { string: { max_len: 2048 } } }];
  repeated string files             = 5 [(validate.rules).repeated = { max_items: 10,
                                                                       items: { string: { max_len: 2048 } } }];
  repeated int64 mentioned_user_ids = 6 [(validate.rules).repeated = { max_items: 100, unique: true,
                                                                       items: { int64: { gt: 0 } } }];
  string client_message_id          = 7 [(validate.rules).string = { ignore_empty: true, min_len: 1, max_len: 64 }];
  // Omit or 0 = main channel; > 0 = topic thread.
  int64 topic_id            = 8 [(validate.rules).int64 = { gte: 0 }];
  int64 reply_to_message_id = 9 [(validate.rules).int64 = { gte: 0 }];
  // Optional excerpt from the parent message; requires reply_to_message_id when set.
  string reply_quote_text = 14 [(validate.rules).string = { max_len: 4096 }];
  // UTF-16 code-unit offset of reply_quote_text within the parent message content.
  int32 reply_quote_position = 15 [(validate.rules).int32 = { gte: 0 }];
  // >0 => reply in thread under that top-level parent; first send creates thread metadata.
  int64 message_thread_root_id = 10 [(validate.rules).int64 = { gte: 0 }];
  int64 sticker_id             = 11 [(validate.rules).int64 = { gte: 0 }];
  repeated LinkPreview link_previews = 12 [(validate.rules).repeated = {
    max_items: 5,
    items: { message: { required: true } }
  }];
  // Optional forward grant hash from ShareMessage; content may be empty comment.
  string shared_message_hash = 13 [(validate.rules).string = { ignore_empty: true, min_len: 1, max_len: 64 }];
  // Original name/size per uploaded file (matched to `files` by URL).
  repeated FileMeta file_metas = 16 [(validate.rules).repeated = { max_items: 10 }];
  // When true, expand to all active group members (excluding sender) at send time.
  // Optional explicit mentioned_user_ids are unioned (e.g. PUBLIC extras).
  bool mention_all = 17;
  // Telegram guest mentions when the group has an ACTIVE ChatGroupTelegramLink.
  // Rejected when bridge is not ACTIVE; mutually exclusive with mentioned_user_ids / mention_all.
  repeated int64 mentioned_telegram_user_ids = 18 [(validate.rules).repeated = {
    max_items: 100,
    unique: true,
    items: { int64: { gt: 0 } }
  }];
  // When true with message_thread_root_id > 0, persist also_sent_to_timeline and project
  // this reply onto the parent channel/topic timeline under the same id. Invalid when
  // message_thread_root_id == 0.
  bool also_send_to_timeline = 19;
}

message SendChatGroupMessageReply {
  ChatGroupMessageInfo message = 1;
  bool duplicate               = 2;
}

message UpdateChatGroupMessageRequest {
  int64 message_id                  = 1 [(validate.rules).int64 = { gt: 0 }];
  string content                    = 2 [(validate.rules).string = { max_len: 4096 }];
  repeated string images            = 3 [(validate.rules).repeated = { max_items: 10,
                                                                       items: { string: { max_len: 2048 } } }];
  repeated string videos            = 4 [(validate.rules).repeated = { max_items: 10,
                                                                       items: { string: { max_len: 2048 } } }];
  repeated string files             = 5 [(validate.rules).repeated = { max_items: 10,
                                                                       items: { string: { max_len: 2048 } } }];
  repeated int64 mentioned_user_ids = 6 [(validate.rules).repeated = { max_items: 100, unique: true,
                                                                       items: { int64: { gt: 0 } } }];
  repeated LinkPreview link_previews = 7 [(validate.rules).repeated = {
    max_items: 5,
    items: { message: { required: true } }
  }];
  // Original name/size per uploaded file (matched to `files` by URL).
  repeated FileMeta file_metas = 8 [(validate.rules).repeated = { max_items: 10 }];
  // When true, re-expand to all active group members (excluding sender) at edit time.
  // Optional explicit mentioned_user_ids are unioned; set false to clear @all.
  bool mention_all = 9;
  // Telegram guest mentions when the group has an ACTIVE ChatGroupTelegramLink.
  // Rejected when bridge is not ACTIVE; mutually exclusive with mentioned_user_ids / mention_all.
  repeated int64 mentioned_telegram_user_ids = 10 [(validate.rules).repeated = {
    max_items: 100,
    unique: true,
    items: { int64: { gt: 0 } }
  }];
