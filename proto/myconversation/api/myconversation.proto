  int64 id                                              = 1;
  int64 conversation_id                                 = 2;
  int64 evaluator_user_id                               = 3;
  int64 cs_user_id                                      = 4;
  repeated QAEvaluationCriterionScore criteria_scores     = 5;
  repeated model.v1.QAEvaluationCriticalError critical_errors = 6;
  int32 total_score                                     = 7;
  model.v1.QAEvaluationStatus status                    = 8;
  string comment                                        = 9;
  google.protobuf.Timestamp evaluated_at                = 10;
  model.v1.Platform platform                            = 11;
  int32 criteria_total                                  = 12;
  int32 money_penalty                                   = 13;
  int32 point_deduction                                 = 14;
  repeated model.v1.QAEvaluationEvidencePin evidence_pins = 15;
  bool stale                                            = 16;
  model.v1.QAEvaluationRatingTier rating_tier           = 17;
  int64 coverage_up_to_message_id                       = 18;
}

message GetQAEvaluationReply {
  QAEvaluationInfo evaluation = 1;
}

message SubmitQAEvaluationRequest {
  int64 conversation_id = 1 [(validate.rules).int64 = { gt: 0 }];
  // Required for EVALUATED/DISPUTE (exactly 7). Optional/empty for INELIGIBLE.
  repeated QAEvaluationCriterionScore criteria_scores = 2 [(validate.rules).repeated = { max_items: 7 }];
  repeated model.v1.QAEvaluationCriticalError critical_errors = 3 [(validate.rules).repeated = { max_items: 9, unique: true,
                                                                                                items: { enum: { defined_only: true } } }];
  // Allowed: EVALUATED, DISPUTE, INELIGIBLE, DRAFT (not PENDING/UNSPECIFIED).
  // DRAFT = lưu tạm: 1..7 criteria, no pin/note requirement; excluded from ranking averages.
  model.v1.QAEvaluationStatus status = 4 [(validate.rules).enum = { defined_only: true, not_in: [0, 1] }];
  string comment = 5 [(validate.rules).string = { ignore_empty: true, max_len: 4096 }];
  repeated model.v1.QAEvaluationEvidencePin evidence_pins = 6 [(validate.rules).repeated = { max_items: 50 }];
  // IMPORTANT opt-in: when true, total_score = criteria sum only; critical errors add money_penalty (not points).
  // Default false keeps legacy point deduction on total_score.
  bool use_money_penalty = 7;
  // Optional override of credited CS (SALES participant or conversation assignee). 0 = ResolveCsUserID.
  // On DRAFT/INELIGIBLE an invalid id is ignored (falls back) so lưu tạm is not blocked.
  int64 primary_cs_user_id = 8 [(validate.rules).int64 = { ignore_empty: true, gte: 0 }];
}

message SubmitQAEvaluationReply {
  QAEvaluationInfo evaluation = 1;
}

message QAEvaluationCriterionAvg {
