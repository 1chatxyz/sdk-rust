}

message DeleteChatGroupMessageRequest {
  int64 message_id = 1 [(validate.rules).int64 = { gt: 0 }];
}

message DeleteChatGroupMessageReply {
  ChatGroupMessageInfo message = 1;
}

message ListChatGroupMessagesRequest {
  int64 group_id  = 1 [(validate.rules).int64 = { gt: 0 }];
  int32 page_size = 2;
  // Omit or 0 = main channel; > 0 = topic thread.
  int64 topic_id = 4 [(validate.rules).int64 = { gte: 0 }];
  // Pagination cursors — mutually exclusive; omit all for the newest page.
  // before_message_id: exclusive upper bound (id < cursor), older messages.
  int64 before_message_id = 3;
  // after_message_id: exclusive lower bound (id > cursor), newer messages.
  int64 after_message_id = 5;
  // around_message_id: inclusive anchor for search/mention jump; page_size is total window.
  int64 around_message_id = 6;
  // Reserved: was message_thread_root_id dual-mode filter; use ListChatGroupThreadMessages.
  reserved 7;
  reserved "message_thread_root_id";
}

message ListChatGroupMessageThreadsRequest {
  int64 group_id = 1 [(validate.rules).int64 = { gt: 0 }];
  // 0 = main channel; >0 = that topic.
  int64 topic_id = 2 [(validate.rules).int64 = { gte: 0 }];
  // When true, only threads with caller unread_count > 0.
  bool unread_only = 3;
  int32 page_size  = 4;
  // Keyset cursor: threads with last_message_at older than this (or equal at + smaller root id).
  google.protobuf.Timestamp page_before_last_message_at = 5;
  int64 page_before_root_message_id                     = 6;
}

message ChatGroupMessageThreadInfo {
  MessageThreadSummary thread      = 1;
  ChatGroupMessageInfo root_message = 2;
  ChatGroupMessageInfo last_reply   = 3;
  int64 topic_id                    = 4;
}

message ListChatGroupMessageThreadsReply {
  repeated ChatGroupMessageThreadInfo threads = 1;
  int32 page_size                             = 2;
  bool has_more                               = 3;
}

message ListChatGroupThreadMessagesRequest {
  int64 group_id = 1 [(validate.rules).int64 = { gt: 0 }];
  int64 topic_id = 2 [(validate.rules).int64 = { gte: 0 }];
  // Required: top-level root message id for the reply thread.
  int64 root_message_id = 3 [(validate.rules).int64 = { gt: 0 }];
  int32 page_size       = 4;
  int64 before_message_id = 5;
  int64 after_message_id  = 6;
  int64 around_message_id = 7;
}

message ListChatGroupThreadMessagesReply {
  repeated ChatGroupMessageInfo messages = 1;
  int32 page_size                        = 2;
  // Reserved: was has_older / has_newer; clients use total_count + cursors.
  reserved 3, 4;
  reserved "has_older", "has_newer";
  // Total replies in this thread (excludes the root message).
  int64 total_count = 5;
}

message ListChatGroupMessagesReply {
  // Reserved: was messages / page_size; clients use items + has_older / has_newer.
  reserved 1, 2;
  reserved "messages", "page_size";
  // True when more messages exist below min(returned.id).
  bool has_older = 3;
  // True when more messages exist above max(returned.id).
  bool has_newer = 4;
  // Mixed timeline (oldest-first within each page). Replayable ChatGroupStreamEvent variants
  // only: message, member_change, meta_change, topic_change, pinned_change,
  // guest_presence_change. Live-only payloads (ping, typing, read/received/reaction_change,
  // presence_change) never appear here.
  repeated ChatGroupStreamEvent items = 5;
}

message MarkChatGroupReadRequest {
  int64 group_id             = 1 [(validate.rules).int64 = { gt: 0 }];
  int64 last_read_message_id = 2 [(validate.rules).int64 = { gte: 0 }];
  // Omit or 0 = main channel; > 0 = topic thread.
  int64 topic_id = 3 [(validate.rules).int64 = { gte: 0 }];
  // Omit or 0 = channel/topic cursor. > 0 = mark read inside that message reply thread.
  int64 message_thread_root_id = 4 [(validate.rules).int64 = { gte: 0 }];
}

// MarkChatGroupRead reply.
message MarkChatGroupReadReply {
  // Main/topic mark-read: full scope badge after clear (top-level + followed-in-scope).
  // Thread mark-read (message_thread_root_id > 0): remaining thread bubble unread only.
  int64 unread_count = 1;
  // Thread mark-read only: parent scope badge after the thread clear (main or topic).
  // 0 when marking main/topic top-level read (use unread_count for the scope badge).
  int64 scope_unread_count = 2;
}

// Client ACK after fetching messages locally (idempotent per user + message).
message MarkChatGroupReceivedRequest {
  int64 group_id = 1 [(validate.rules).int64 = { gt: 0 }];
  // Omit or 0 = main channel; > 0 = topic thread.
  int64 topic_id             = 2 [(validate.rules).int64 = { gte: 0 }];
  repeated int64 message_ids = 3 [(validate.rules).repeated = { min_items: 1, max_items: 200, unique: true,
                                                                items: { int64: { gt: 0 } } }];
}

message MarkChatGroupReceivedReply {
  int64 accepted_count = 1;
}

message SetChatGroupMessageReactionRequest {
  int64 message_id = 1 [(validate.rules).int64 = { gt: 0 }];
  string emoji     = 2 [(validate.rules).string = { min_len: 1, max_len: 64 }];
  bool remove      = 3;
}

message SetChatGroupMessageReactionReply {
  repeated MessageReaction reactions = 1;
}

message SetChatGroupMessagePinnedRequest {
  int64 message_id = 1 [(validate.rules).int64 = { gt: 0 }];
  bool pinned      = 2;
  // Only honored when pinned=true; enqueue push to group members (except pinner). Ignored on unpin.
  bool notify = 3;
}

message SetChatGroupMessagePinnedReply {
  ChatGroupMessageInfo message = 1;
}

message ListChatGroupPinnedMessagesRequest {
  int64 group_id  = 1 [(validate.rules).int64 = { gt: 0 }];
  // Omit or 0 = main channel; > 0 = topic thread.
  int64 topic_id  = 2 [(validate.rules).int64 = { gte: 0 }];
  int32 page_size = 3;
  // Optional content search (pinned message body only). Empty = browse all pins in scope.
  string query = 4 [(validate.rules).string = { ignore_empty: true, max_len: 256 }];
  // Browse mode (query empty): exclusive upper bound on pin row id; omit for the newest page.
  int64 before_pin_id = 5 [(validate.rules).int64 = { gte: 0 }];
  // Search mode (query non-empty): 1-based page index.
  int32 page = 6;
}

message ListChatGroupPinnedMessagesReply {
  repeated ChatGroupMessageInfo messages = 1;
  int32 page_size                        = 2;
  bool has_next                          = 3;
}

message ListMyChatGroupMentionsRequest {
  int32 page_size = 1;
  // Opaque cursor from the prior reply's next_cursor; omit for the first page.
  bytes next_cursor = 2;
}

// my_role = UNSPECIFIED when caller is not a member (public group mention).
message ChatGroupMentionHit {
  ChatGroupMessageInfo message   = 1;
  ChatGroupInfo group            = 2;
  ChatGroupTopicInfo topic       = 3;  // empty when main channel (topic_id = 0)
  bool seen                      = 4;  // read_at != null
  model.v1.ChatGroupRole my_role = 5;
}

message ListMyChatGroupMentionsReply {
  repeated ChatGroupMentionHit hits = 1;
  int32 page_size                   = 2;
  // Empty when there are no more rows; pass back as next_cursor for the following page.
  bytes next_cursor    = 3;
  bool has_more_unread = 4;  // true when unseen rows remain after this page
}

message MarkChatGroupMentionReadRequest {
  int64 message_id = 1 [(validate.rules).int64 = { gt: 0 }];
}

message MarkChatGroupMentionReadReply {
}

message SearchChatGroupsRequest {
  string query    = 1 [(validate.rules).string = { min_len: 1, max_len: 256 }];
  int32 page_size = 2;
  int32 page      = 3;
}

// my_role = UNSPECIFIED means the caller is not a member (discoverable public group).
message ChatGroupSearchHit {
  ChatGroupInfo group            = 1;
  model.v1.ChatGroupRole my_role = 2;
}

message SearchChatGroupsReply {
  repeated ChatGroupSearchHit hits = 1;
  int32 page_size                  = 2;
  int32 page                       = 3;
  int64 count                      = 4;
}

message SearchGroupMessagesRequest {
  int64 group_id = 1 [(validate.rules).int64 = { gt: 0 }];
  // Empty = main channel only; include 0 for main, >0 for topic threads.
  repeated int64 topic_ids = 2 [(validate.rules).repeated = { max_items: 50, unique: true,
                                                              items: { int64: { gte: 0 } } }];
  string query             = 3 [(validate.rules).string = { min_len: 1, max_len: 256 }];
  int32 page_size          = 4;
  int32 page               = 5;
  SearchMessagesSort sort  = 6 [(validate.rules).enum = { defined_only: true }];
  // Omit or 0 = any sender.
  int64 from_user_id = 7 [(validate.rules).int64 = { gte: 0 }];
  // Optional UTC bounds on message created_at. Omit either for an open-ended window.
  google.protobuf.Timestamp from_time = 8;
  google.protobuf.Timestamp to_time   = 9;
  // Omit or 0: search all messages (top-level and replies). >0: restrict to replies within that thread.
  int64 message_thread_root_id = 10 [(validate.rules).int64 = { gte: 0 }];
}

message SearchGroupMessagesReply {
  repeated ChatGroupMessageInfo hits = 1;
  int32 page_size                    = 2;
  int32 page                         = 3;
  bool has_next                      = 4;
}

// ── Staff group chat live stream ──

message SignalChatGroupTypingRequest {
  int64 group_id = 1 [(validate.rules).int64 = { gt: 0 }];
  bool typing    = 2;
  // Omit or 0 = main channel; > 0 = topic thread.
  int64 topic_id = 3 [(validate.rules).int64 = { gte: 0 }];
}

message SignalChatGroupTypingReply {}

message ChatGroupTypingIndicator {
  int64 group_id  = 1;
  int64 user_id   = 2;
  string username = 3;
  bool typing     = 4;
  // 0 = main channel; > 0 = topic thread.
  int64 topic_id = 5;
}

message StreamChatGroupsRequest {
  int64 resume_after_message_id = 1;
  int64 resume_after_event_id   = 2;
}

// Keepalive for StreamChatGroups; ignored by clients except to hold the connection open.
message ChatGroupStreamPing {
  int64 server_time_unix_ms = 1;
}

enum ChatGroupMemberChangeType {
  CHAT_GROUP_MEMBER_CHANGE_TYPE_UNSPECIFIED  = 0;
  CHAT_GROUP_MEMBER_CHANGE_TYPE_ADDED        = 1;
  CHAT_GROUP_MEMBER_CHANGE_TYPE_REMOVED      = 2;
  CHAT_GROUP_MEMBER_CHANGE_TYPE_LEFT         = 3;
  CHAT_GROUP_MEMBER_CHANGE_TYPE_JOINED       = 4;
  CHAT_GROUP_MEMBER_CHANGE_TYPE_ROLE_CHANGED = 5;
}

// Membership snapshot; replayed on reconnect via resume_after_event_id and ListChatGroupMessages.
message ChatGroupMemberChange {
  int64 group_id                        = 1;
  ChatGroupMemberChangeType change_type = 2;
  int64 user_id                         = 3;
  model.v1.ChatGroupRole role           = 4;
  // ChatGroupStreamEventLog.id for this mutation; FE keeps the event with the higher value.
  int64 event_id = 5 [(validate.rules).int64 = { gt: 0 }];
  int64 actor_user_id                  = 6;
  google.protobuf.Timestamp event_at   = 7;
}

// Group metadata snapshot; replayed on reconnect via resume_after_event_id and ListChatGroupMessages.
message ChatGroupMetaChange {
  int64 group_id      = 1;
  ChatGroupInfo group = 2;
  // ChatGroupStreamEventLog.id for this mutation; FE keeps the event with the higher value.
  int64 event_id = 3 [(validate.rules).int64 = { gt: 0 }];
  int64 actor_user_id                = 4;
  google.protobuf.Timestamp event_at = 5;
}

enum ChatGroupTopicChangeType {
  CHAT_GROUP_TOPIC_CHANGE_TYPE_UNSPECIFIED = 0;
  CHAT_GROUP_TOPIC_CHANGE_TYPE_CREATED     = 1;
  CHAT_GROUP_TOPIC_CHANGE_TYPE_UPDATED     = 2;
  CHAT_GROUP_TOPIC_CHANGE_TYPE_DELETED     = 3;
}

// Topic lifecycle snapshot; replayed on reconnect via resume_after_event_id and ListChatGroupMessages.
message ChatGroupTopicChange {
  int64 group_id                       = 1;
  ChatGroupTopicChangeType change_type = 2;
  ChatGroupTopicInfo topic             = 3;
  // ChatGroupStreamEventLog.id for this mutation; FE keeps the event with the higher value.
  int64 event_id = 4 [(validate.rules).int64 = { gt: 0 }];
  int64 actor_user_id                = 5;
  google.protobuf.Timestamp event_at = 6;
}

// Live-only read receipt when a member marks read (MarkChatGroupRead); not replayed on reconnect.
// Never emitted when the reader is an active anonymous member (same silent pattern as MEMBER_CHANGE).
message ChatGroupReadChange {
  int64 group_id             = 1;
  int64 topic_id             = 2;  // 0 = main channel; > 0 = topic thread
  int64 reader_user_id       = 3;
  int64 last_read_message_id = 4;
  // Same semantics as MarkChatGroupReadReply.unread_count (scope badge for main/topic; thread bubble for thread).
  int64 unread_count = 5;
  // > 0 = MarkChatGroupRead with message_thread_root_id (reply-thread cursor); 0 = main/topic.
  int64 message_thread_root_id = 6;
  // Thread mark-read only: parent scope badge after the thread clear. Same as MarkChatGroupReadReply.scope_unread_count.
  int64 scope_unread_count = 7;
}

// Live-only received ACK for peers (receipt = xác nhận đã nhận tin); not replayed on reconnect.
// Never emitted when the receiver is an active anonymous member.
message ChatGroupReceivedChange {
  int64 group_id             = 1;
  int64 topic_id             = 2;  // 0 = main channel; > 0 = topic thread
  int64 receiver_user_id     = 3;
  repeated int64 message_ids = 4;
  int64 received_at_unix_ms  = 5;
}

// Live-only reaction snapshot when a member reacts/unreacts; not replayed on reconnect.
message ChatGroupReactionChange {
  int64 group_id                     = 1;
  int64 topic_id                     = 2;  // 0 = main channel; > 0 = topic thread
  int64 message_id                   = 3;
  repeated MessageReaction reactions = 4;
  // Auto-increment id of the reaction row inserted or removed in this mutation; FE keeps the event with the higher value.
  int64 last_reaction_id             = 5 [(validate.rules).int64 = { gt: 0 }];
}

// Pin/unpin snapshot; replayed on reconnect via resume_after_event_id.
message ChatGroupPinnedChange {
  int64 group_id                       = 1;
  int64 topic_id                       = 2;  // 0 = main channel; > 0 = topic thread
  int64 message_id                     = 3;
  bool pinned                          = 4;
  int64 pinned_by_user_id              = 5;
  google.protobuf.Timestamp pinned_at  = 6;
  // ChatGroupStreamEventLog.id for this mutation; FE keeps the event with the higher value.
  int64 event_id = 7 [(validate.rules).int64 = { gt: 0 }];
}

enum ChatGroupGuestPresenceChangeType {
  CHAT_GROUP_GUEST_PRESENCE_CHANGE_TYPE_UNSPECIFIED = 0;
  CHAT_GROUP_GUEST_PRESENCE_CHANGE_TYPE_JOINED      = 1;
  CHAT_GROUP_GUEST_PRESENCE_CHANGE_TYPE_LEFT        = 2;
}

// Telegram guest join/leave presence; never creates ChatGroupMember rows.
// Replayed on reconnect via resume_after_event_id and ListChatGroupMessages.
message ChatGroupGuestPresenceChange {
  int64 group_id                                   = 1;
  ChatGroupGuestPresenceChangeType change_type     = 2;
  int64 telegram_user_id                           = 3;
  string display_name                              = 4;
  string username                                  = 5;
  string external_avatar_url                       = 6;
  // ChatGroupStreamEventLog.id for this mutation; FE keeps the event with the higher value.
  int64 event_id = 7 [(validate.rules).int64 = { gt: 0 }];
  google.protobuf.Timestamp event_at               = 8;
}

message ChatGroupStreamEvent {
  oneof item {
    ChatGroupStreamPing ping                        = 1;
    ChatGroupMessageInfo message                    = 2;
    ChatGroupMemberChange member_change             = 3;
    ChatGroupMetaChange meta_change                 = 4;
    ChatGroupTypingIndicator typing                 = 5;
    ChatGroupTopicChange topic_change               = 6;
    ChatGroupReadChange read_change                 = 7;
    ChatGroupReceivedChange received_change         = 8;
    ChatGroupReactionChange reaction_change         = 9;
    ChatGroupPinnedChange pinned_change             = 10;
    ChatGroupGuestPresenceChange guest_presence_change = 11;
    // Live-only staff presence; not replayed on reconnect.
    PresenceChange presence_change                  = 12;
  }
}

// ── Staff direct message (1:1; separate from ChatGroup) ──

message DirectMessagePeerInfo {
  int64 user_id       = 1;
  string display_name = 2;
  string avatar_url   = 3;
  string user_name    = 4;
  // Effective staff presence badge (Redis-backed; UNSPECIFIED when unknown / not enriched).
  PresenceState presence = 5;
  // Custom status overlay; absent/empty when none (or expired).
  CustomStatus custom_status = 6;
}

message DirectMessageThreadInfo {
  int64 id                                  = 1;
  DirectMessagePeerInfo peer                = 2;
  google.protobuf.Timestamp last_message_at = 3;
  int64 last_message_id                     = 4;
  DirectMessageInfo last_message            = 5;
  int64 unread_count                        = 6;
  google.protobuf.Timestamp created_at      = 7;
  // True when the DM's global last message is a thread reply (not main timeline top-level).
  bool last_message_in_thread = 8;
  // Parent message id when last_message_in_thread is true; for navigation into the thread.
  int64 last_message_thread_root_id = 9;
  // True when the caller has pinned this DM thread (per-user sidebar preference).
  bool pinned = 10;
  // CUSTOM sidebar section this DM thread belongs to (0 when not in any custom section = DEFAULT).
  int64 section_id = 11;
}

message SetDirectMessageThreadPinnedRequest {
  int64 thread_id = 1 [(validate.rules).int64 = { gt: 0 }];
  bool pinned     = 2;
}

message SetDirectMessageThreadPinnedReply {
  DirectMessageThreadInfo thread = 1;
}

enum DirectMessageDeliveryStatus {
  DIRECT_MESSAGE_DELIVERY_STATUS_UNSPECIFIED = 0;
  DIRECT_MESSAGE_DELIVERY_STATUS_SENT        = 1;
  DIRECT_MESSAGE_DELIVERY_STATUS_RECEIVED    = 2;
  DIRECT_MESSAGE_DELIVERY_STATUS_READ        = 3;
}

message DirectMessageInfo {
  int64 id                                    = 1;
  int64 thread_id                             = 2;
  int64 sender_user_id                        = 3;
  string sender_username                      = 4;
  string content                              = 5;
  repeated string images                      = 6;
  repeated string videos                      = 7;
  repeated string files                       = 8;
  google.protobuf.Timestamp created_at        = 9;
  google.protobuf.Timestamp edited_at         = 10;
  google.protobuf.Timestamp deleted_at        = 11;
  int64 reply_to_message_id                   = 12;
  DirectMessageInfo reply_to                  = 13;
  DirectMessageDeliveryStatus delivery_status = 14;
  int64 received_at_unix_ms                   = 15;
  int64 read_at_unix_ms                       = 16;
  // 0 = top-level; on thread replies, the parent message id.
  int64 message_thread_root_id = 17;
  // Set on top-level messages when reply_count > 0.
  MessageThreadSummary message_thread = 18;
  int64 sticker_id   = 19;
  string sticker_url = 20 [(validate.rules).string = { ignore_empty: true, max_len: 2048 }];
  repeated MessageReaction reactions   = 21;
  repeated LinkPreview link_previews   = 22;
  bool pinned                          = 26;
  google.protobuf.Timestamp pinned_at  = 27;
  int64 pinned_by_user_id              = 28;
  // Set when this message forwards a shared snapshot (see ShareMessage / GetSharedMessage).
  string shared_message_hash = 29 [(validate.rules).string = { ignore_empty: true, min_len: 1, max_len: 64 }];
  // Excerpt from the parent message when the reply quotes a substring; empty when not a quote-reply.
  string reply_quote_text = 30 [(validate.rules).string = { max_len: 4096 }];
  // UTF-16 code-unit offset of reply_quote_text within the parent message content; 0 when not set.
  int32 reply_quote_position = 31 [(validate.rules).int32 = { gte: 0 }];
  // Original name/size per uploaded file (matched to `files` by URL).
  repeated FileMeta file_metas = 32;
  // True when this thread reply was also projected onto the main DM timeline at send
  // time (same message id). Only meaningful when message_thread_root_id > 0.
  bool also_sent_to_timeline = 33;
  // Caller's Later save status for this message. UNSPECIFIED = not saved by the caller.
  // Nested reply_to is left UNSPECIFIED (only top-level page rows are enriched).
  SavedMessageStatus saved_status = 34;
}

message CreateOrGetDirectMessageRequest {
  int64 other_user_id = 1 [(validate.rules).int64 = { gt: 0 }];
}

message CreateOrGetDirectMessageReply {
  DirectMessageThreadInfo thread = 1;
  bool created                   = 2;
}

message ListMyDirectMessagesRequest {
  int32 page_size = 1;
  int32 page      = 2;
  // UNSPECIFIED / ALL = no section filter (return all DM threads).
  // DEFAULT = only threads not in any CUSTOM section (section_id IS NULL).
  SidebarListScope scope = 3;
}

message ListMyDirectMessagesReply {
  repeated DirectMessageThreadInfo threads = 1;
  int32 page_size                          = 2;
  int32 page                               = 3;
  int64 count                              = 4;
}

message GetDirectMessageRequest {
  int64 thread_id = 1 [(validate.rules).int64 = { gt: 0 }];
}

message GetDirectMessageReply {
  DirectMessageThreadInfo thread = 1;
}

message SendDirectMessageRequest {
  int64 thread_id           = 1 [(validate.rules).int64 = { gte: 0 }];
  int64 other_user_id       = 2 [(validate.rules).int64 = { gte: 0 }];
  string content            = 3 [(validate.rules).string = { max_len: 4096 }];
  repeated string images    = 4 [(validate.rules).repeated = { max_items: 10,
                                                               items: { string: { max_len: 2048 } } }];
  repeated string videos    = 5 [(validate.rules).repeated = { max_items: 10,
                                                               items: { string: { max_len: 2048 } } }];
  repeated string files     = 6 [(validate.rules).repeated = { max_items: 10,
                                                               items: { string: { max_len: 2048 } } }];
  string client_message_id  = 7 [(validate.rules).string = { ignore_empty: true, min_len: 1, max_len: 64 }];
  int64 reply_to_message_id = 8 [(validate.rules).int64 = { gte: 0 }];
  // Optional excerpt from the parent message; requires reply_to_message_id when set.
  string reply_quote_text = 13 [(validate.rules).string = { max_len: 4096 }];
  // UTF-16 code-unit offset of reply_quote_text within the parent message content.
  int32 reply_quote_position = 14 [(validate.rules).int32 = { gte: 0 }];
  // >0 => reply in thread under that top-level parent; first send creates thread metadata.
  int64 message_thread_root_id = 9 [(validate.rules).int64 = { gte: 0 }];
  int64 sticker_id             = 10 [(validate.rules).int64 = { gte: 0 }];
  repeated LinkPreview link_previews = 11 [(validate.rules).repeated = {
    max_items: 5,
    items: { message: { required: true } }
  }];
  // Optional forward grant hash from ShareMessage; content may be empty comment.
  string shared_message_hash = 12 [(validate.rules).string = { ignore_empty: true, min_len: 1, max_len: 64 }];
  // Original name/size per uploaded file (matched to `files` by URL).
  repeated FileMeta file_metas = 15 [(validate.rules).repeated = { max_items: 10 }];
  // When true with message_thread_root_id > 0, persist also_sent_to_timeline and project
  // this reply onto the main DM timeline under the same id. Invalid when
  // message_thread_root_id == 0.
  bool also_send_to_timeline = 16;
}

message SendDirectMessageReply {
  DirectMessageInfo message = 1;
  int64 thread_id           = 2;
  bool duplicate            = 3;
}

message UpdateDirectMessageRequest {
  int64 message_id       = 1 [(validate.rules).int64 = { gt: 0 }];
  string content         = 2 [(validate.rules).string = { max_len: 4096 }];
  repeated string images = 3 [(validate.rules).repeated = { max_items: 10,
                                                            items: { string: { max_len: 2048 } } }];
  repeated string videos = 4 [(validate.rules).repeated = { max_items: 10,
                                                            items: { string: { max_len: 2048 } } }];
  repeated string files  = 5 [(validate.rules).repeated = { max_items: 10,
                                                            items: { string: { max_len: 2048 } } }];
  repeated LinkPreview link_previews = 6 [(validate.rules).repeated = {
    max_items: 5,
    items: { message: { required: true } }
  }];
  // Original name/size per uploaded file (matched to `files` by URL).
  repeated FileMeta file_metas = 7 [(validate.rules).repeated = { max_items: 10 }];
}

message UpdateDirectMessageReply {
  DirectMessageInfo message = 1;
}

message DeleteDirectMessageRequest {
  int64 message_id = 1 [(validate.rules).int64 = { gt: 0 }];
}

message DeleteDirectMessageReply {
  DirectMessageInfo message = 1;
}

message ListDirectMessagesRequest {
  int64 thread_id = 1 [(validate.rules).int64 = { gt: 0 }];
  int32 page_size = 2;
  // Pagination cursors — mutually exclusive; omit all for the newest page.
  int64 before_message_id = 3;
  int64 after_message_id  = 4;
  int64 around_message_id = 5;
  // Reserved: was message_thread_root_id dual-mode filter; use ListDirectMessageReplyMessages.
  reserved 6;
  reserved "message_thread_root_id";
}

message ListDirectMessageReplyThreadsRequest {
  int64 thread_id = 1 [(validate.rules).int64 = { gt: 0 }];
  // When true, only threads with caller unread_count > 0.
  bool unread_only = 2;
  int32 page_size  = 3;
  google.protobuf.Timestamp page_before_last_message_at = 4;
  int64 page_before_root_message_id                     = 5;
}

message DirectMessageReplyThreadInfo {
  MessageThreadSummary thread     = 1;
  DirectMessageInfo root_message  = 2;
  DirectMessageInfo last_reply    = 3;
}

message ListDirectMessageReplyThreadsReply {
  repeated DirectMessageReplyThreadInfo threads = 1;
  int32 page_size                               = 2;
  bool has_more                                 = 3;
}

message ListDirectMessageReplyMessagesRequest {
  int64 thread_id = 1 [(validate.rules).int64 = { gt: 0 }];
  // Required: top-level root message id for the reply thread.
  int64 root_message_id = 2 [(validate.rules).int64 = { gt: 0 }];
  int32 page_size       = 3;
  int64 before_message_id = 4;
  int64 after_message_id  = 5;
  int64 around_message_id = 6;
}

message ListDirectMessageReplyMessagesReply {
  repeated DirectMessageInfo messages = 1;
  int32 page_size                     = 2;
  // Reserved: was has_older / has_newer; clients use total_count + cursors.
  reserved 3, 4;
  reserved "has_older", "has_newer";
  // Total replies in this thread (excludes the root message).
  int64 total_count = 5;
}

message ListDirectMessagesReply {
  repeated DirectMessageInfo messages = 1;
  int32 page_size                     = 2;
  bool has_older                      = 3;
  bool has_newer                      = 4;
}

message MarkDirectMessageReadRequest {
  int64 thread_id            = 1 [(validate.rules).int64 = { gt: 0 }];
  int64 last_read_message_id = 2 [(validate.rules).int64 = { gte: 0 }];
  // Omit or 0 = DM timeline cursor. > 0 = mark read inside that message reply thread.
  int64 message_thread_root_id = 3 [(validate.rules).int64 = { gte: 0 }];
}

message MarkDirectMessageReadReply {
  int64 unread_count = 1;
}

message MarkDirectMessageReceivedRequest {
  int64 thread_id            = 1 [(validate.rules).int64 = { gt: 0 }];
  repeated int64 message_ids = 2 [(validate.rules).repeated = { min_items: 1, max_items: 200, unique: true,
                                                                items: { int64: { gt: 0 } } }];
}

message MarkDirectMessageReceivedReply {
  int64 accepted_count = 1;
}

message SetDirectMessageReactionRequest {
  int64 message_id = 1 [(validate.rules).int64 = { gt: 0 }];
  string emoji     = 2 [(validate.rules).string = { min_len: 1, max_len: 64 }];
  bool remove      = 3;
}

message SetDirectMessageReactionReply {
  repeated MessageReaction reactions = 1;
}

message SetDirectMessagePinnedRequest {
  int64 message_id = 1 [(validate.rules).int64 = { gt: 0 }];
  bool pinned      = 2;
  // Only honored when pinned=true; enqueue push to DM peer (not pinner). Ignored on unpin.
  bool notify = 3;
}

message SetDirectMessagePinnedReply {
  DirectMessageInfo message = 1;
}

message ListDirectMessagePinnedMessagesRequest {
  int64 thread_id = 1 [(validate.rules).int64 = { gt: 0 }];
  int32 page_size = 2;
  // Optional content search (pinned message body only). Empty = browse all pins in scope.
  string query = 3 [(validate.rules).string = { ignore_empty: true, max_len: 256 }];
  // Browse mode (query empty): exclusive upper bound on pin row id; omit for the newest page.
  int64 before_pin_id = 4 [(validate.rules).int64 = { gte: 0 }];
  // Search mode (query non-empty): 1-based page index.
  int32 page = 5;
}

message ListDirectMessagePinnedMessagesReply {
  repeated DirectMessageInfo messages = 1;
  int32 page_size                     = 2;
  bool has_next                       = 3;
}

message SearchDirectMessagesRequest {
  // 0 = all threads where caller is participant; > 0 = single thread after participant check.
  int64 thread_id                     = 1 [(validate.rules).int64 = { gte: 0 }];
  string query                        = 2 [(validate.rules).string = { min_len: 1, max_len: 256 }];
  int32 page_size                     = 3;
  int32 page                          = 4;
  SearchMessagesSort sort             = 5 [(validate.rules).enum = { defined_only: true }];
  int64 from_user_id                  = 6 [(validate.rules).int64 = { gte: 0 }];
  google.protobuf.Timestamp from_time = 7;
  google.protobuf.Timestamp to_time   = 8;
  // Omit or 0: search all messages (top-level and replies). >0: restrict to replies within that thread.
  int64 message_thread_root_id = 9 [(validate.rules).int64 = { gte: 0 }];
}

message SearchDirectMessageHit {
  DirectMessageInfo message      = 1;
  DirectMessageThreadInfo thread = 2;
}

message SearchDirectMessagesReply {
  repeated SearchDirectMessageHit hits = 1;
  int32 page_size                      = 2;
  int32 page                           = 3;
  bool has_next                        = 4;
}

// ── Staff direct message live stream ──

message SignalDirectMessageTypingRequest {
  int64 thread_id = 1 [(validate.rules).int64 = { gt: 0 }];
  bool typing     = 2;
}

message SignalDirectMessageTypingReply {}

message DirectMessageTypingIndicator {
  int64 thread_id = 1;
  int64 user_id   = 2;
  string username = 3;
  bool typing     = 4;
}

message StreamDirectMessagesRequest {
  int64 resume_after_message_id = 1;
  int64 resume_after_event_id   = 2;
}

message DirectMessageStreamPing {
  int64 server_time_unix_ms = 1;
}

// Live-only read receipt when a participant marks read; not replayed on reconnect.
message DirectMessageReadChange {
  int64 thread_id            = 1;
  int64 reader_user_id       = 2;
  int64 last_read_message_id = 3;
  int64 unread_count         = 4;
}

// Live-only received ACK for peer; not replayed on reconnect.
message DirectMessageReceivedChange {
  int64 thread_id            = 1;
  int64 receiver_user_id     = 2;
  repeated int64 message_ids = 3;
  int64 received_at_unix_ms  = 4;
}

// Live-only reaction snapshot when a participant reacts/unreacts; not replayed on reconnect.
message DirectMessageReactionChange {
  int64 thread_id                    = 1;
  int64 message_id                   = 2;
  repeated MessageReaction reactions = 3;
  // Auto-increment id of the reaction row inserted or removed in this mutation; FE keeps the event with the higher value.
  int64 last_reaction_id             = 4 [(validate.rules).int64 = { gt: 0 }];
}

// Pin/unpin snapshot; replayed on reconnect via resume_after_event_id.
message DirectMessagePinnedChange {
  int64 thread_id                      = 1;
  int64 message_id                     = 2;
  bool pinned                          = 3;
  int64 pinned_by_user_id              = 4;
  google.protobuf.Timestamp pinned_at  = 5;
  // DirectMessageStreamEventLog.id for this mutation; FE keeps the event with the higher value.
  int64 event_id = 6 [(validate.rules).int64 = { gt: 0 }];
}

message DirectMessageStreamEvent {
  oneof item {
    DirectMessageStreamPing ping                = 1;
    DirectMessageInfo message                   = 2;
    DirectMessageTypingIndicator typing         = 3;
    DirectMessageReadChange read_change         = 4;
    DirectMessageReceivedChange received_change = 5;
    DirectMessageReactionChange reaction_change = 6;
    DirectMessagePinnedChange pinned_change     = 7;
    // Live-only staff presence; not replayed on reconnect.
    PresenceChange presence_change              = 8;
  }
}

// ── Staff presence ──

// Manual override. AUTOMATIC derives the badge from device sessions.
enum PresenceMode {
  PRESENCE_MODE_UNSPECIFIED    = 0;
  PRESENCE_MODE_AUTOMATIC      = 1;
  PRESENCE_MODE_AWAY           = 2;
  PRESENCE_MODE_DO_NOT_DISTURB = 3;
}

// Effective badge shown to peers (after mode + session aggregation).
enum PresenceState {
  PRESENCE_STATE_UNSPECIFIED    = 0;
  PRESENCE_STATE_ONLINE         = 1;
  PRESENCE_STATE_IDLE           = 2;
  PRESENCE_STATE_OFFLINE        = 3;
  PRESENCE_STATE_AWAY           = 4;
  PRESENCE_STATE_DO_NOT_DISTURB = 5;
}

// Orthogonal overlay; does not affect push. Empty text means no custom status.
message CustomStatus {
  string emoji                          = 1 [(validate.rules).string = { ignore_empty: true, max_len: 64 }];
  string text                           = 2 [(validate.rules).string = { ignore_empty: true, max_len: 64 }];
  google.protobuf.Timestamp expires_at  = 3;
}

// Live-only staff presence fanout on StreamChatGroups / StreamDirectMessages.
message PresenceChange {
  int64 user_id                = 1;
  PresenceState presence       = 2;
  CustomStatus custom_status   = 3;
}

// Heartbeat per client install. Only ONLINE or IDLE — Offline is implied by session TTL expiry.
message ReportPresenceRequest {
  // Stable per-install id (same idea as RegisterPushDevice.client_device_id).
  string device_id = 1 [(validate.rules).string = { min_len: 1, max_len: 128 }];
  PresenceState session_state = 2 [(validate.rules).enum = {
    defined_only: true,
    in: [ 1, 2 ]  // ONLINE, IDLE
  }];
}

message ReportPresenceReply {
  PresenceState presence     = 1;
  CustomStatus custom_status = 2;
}

message SetPresenceModeRequest {
  PresenceMode mode = 1 [(validate.rules).enum = { defined_only: true, not_in: [ 0 ] }];
  // Required when mode is DO_NOT_DISTURB (absolute UTC end; FE owns presets).
  // Ignored for AUTOMATIC / AWAY (clears any active manual timed DND).
  // Conditional requirement is enforced in the handler (protoc-gen-validate has no mode-gated field rules here).
  google.protobuf.Timestamp expires_at = 2;
}

message SetPresenceModeReply {
  PresenceMode mode          = 1;
  PresenceState presence     = 2;
  CustomStatus custom_status = 3;
  // Echo of active manual timed DND end; unset when not in manual DND.
  google.protobuf.Timestamp dnd_expires_at = 4;
}

message SetCustomStatusRequest {
  string emoji = 1 [(validate.rules).string = { ignore_empty: true, max_len: 64 }];
  // Required non-empty; empty text is rejected (use ClearCustomStatus).
  string text                          = 2 [(validate.rules).string = { min_len: 1, max_len: 64 }];
  google.protobuf.Timestamp expires_at = 3;
}

message SetCustomStatusReply {
  PresenceState presence     = 1;
  CustomStatus custom_status = 2;
}

message ClearCustomStatusRequest {}

message ClearCustomStatusReply {
  PresenceState presence = 1;
}

message GetMyPresenceRequest {}

message GetMyPresenceReply {
  PresenceMode mode          = 1;
  PresenceState presence     = 2;
  CustomStatus custom_status = 3;
  // Set when caller is in manual timed DND (mode DND with mx); unset for schedule-only DND / non-DND.
  google.protobuf.Timestamp dnd_expires_at = 4;
}

message BatchGetPresenceRequest {
  repeated int64 user_ids = 1 [(validate.rules).repeated = {
    min_items: 1,
    max_items: 100,
    unique: true,
    items: { int64: { gt: 0 } }
  }];
}

// One user's effective badge + custom overlay (for BatchGetPresence / list enrich).
message UserPresence {
  int64 user_id              = 1;
  PresenceState presence     = 2;
  CustomStatus custom_status = 3;
}

message BatchGetPresenceReply {
  // Same order as request is not guaranteed; index by user_id.
  repeated UserPresence presences = 1;
}

// Recurring DND schedule (Google Chat–style). Independent of one-shot SetPresenceMode DND.
message DoNotDisturbSchedule {
  bool enabled = 1;
  // IANA timezone (e.g. "Asia/Ho_Chi_Minh"). Required when enabled (handler-enforced).
  string timezone = 2 [(validate.rules).string = { ignore_empty: true, min_len: 1, max_len: 64 }];
  // Local windows; max one week of entries. Empty when disabled.
  repeated DoNotDisturbWindow windows = 3 [(validate.rules).repeated = { max_items: 7 }];
}

message DoNotDisturbWindow {
  // ISO weekday: 1=Monday … 7=Sunday.
  repeated int32 days_of_week = 1 [(validate.rules).repeated = {
    min_items: 1,
    max_items: 7,
    unique: true,
    items: { int32: { gte: 1, lte: 7 } }
  }];
  // Minutes from local midnight [0, 1439].
  int32 start_minute = 2 [(validate.rules).int32 = { gte: 0, lte: 1439 }];
  // Minutes from local midnight [0, 1439]; may be < start_minute (overnight).
  int32 end_minute = 3 [(validate.rules).int32 = { gte: 0, lte: 1439 }];
}

message SetDoNotDisturbScheduleRequest {
  DoNotDisturbSchedule schedule = 1 [(validate.rules).message = { required: true }];
}

message SetDoNotDisturbScheduleReply {
  DoNotDisturbSchedule schedule = 1;
}

message GetDoNotDisturbScheduleRequest {}

message GetDoNotDisturbScheduleReply {
  // Absent/empty fields mean no schedule configured (treated as disabled).
  DoNotDisturbSchedule schedule = 1;
}

// ── Push notifications ──

enum PushPlatform {
  PUSH_PLATFORM_UNSPECIFIED = 0;
  PUSH_PLATFORM_ANDROID     = 1;
  PUSH_PLATFORM_IOS         = 2;
  PUSH_PLATFORM_WEB_CHROME  = 3;
  PUSH_PLATFORM_WEB_FIREFOX = 4;
}

message PushDevice {
  int64 id                             = 1;
  PushPlatform platform                = 2;
  string token                         = 3;
  string app_version                   = 4;
  string locale                        = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  // Stable per-install id from the mobile client; empty for web registrations.
  string client_device_id = 8;
}

message NotificationPreferences {
  bool customer_new_conversation = 1;
  bool customer_messages         = 2;
  bool group_messages            = 3;
  bool group_mentions            = 4;
  bool group_membership          = 5;
  bool direct_messages           = 6;
  bool group_reactions           = 7;
  bool direct_message_reactions  = 8;
}

message RegisterPushDeviceRequest {
  PushPlatform platform = 1 [(validate.rules).enum = { defined_only: true,
                                                       not_in: [ 0 ] }];
  // Plain FCM/APNs registration token (ANDROID, IOS, WEB_CHROME via Firebase getToken),
  // or JSON.stringify(PushSubscription) for WEB_CHROME / WEB_FIREFOX native Web Push.
  string token       = 2 [(validate.rules).string = { min_len: 1, max_len: 8192 }];
  string app_version = 3 [(validate.rules).string = { ignore_empty: true, max_len: 64 }];
  string locale      = 4 [(validate.rules).string = { ignore_empty: true, max_len: 16 }];
  // Required for ANDROID / IOS: stable id generated once per app install (Keychain / Keystore).
  // Ignored for web platforms (subscription supersede is per browser platform).
  string client_device_id = 5 [(validate.rules).string = { ignore_empty: true, max_len: 128 }];
}

message RegisterPushDeviceReply {
  PushDevice device = 1;
}

message UnregisterPushDeviceRequest {
  oneof key {
    int64 device_id = 1 [(validate.rules).int64 = { gt: 0 }];
    string token    = 2 [(validate.rules).string = { min_len: 1, max_len: 8192 }];
  }
}

message UnregisterPushDeviceReply {}

message GetNotificationPreferencesRequest {}

message GetNotificationPreferencesReply {
  NotificationPreferences preferences = 1;
}

message UpdateNotificationPreferencesRequest {
  repeated Change changes = 1 [(validate.rules).repeated = { min_items: 1, max_items: 8 }];

  message Change {
    oneof field {
      bool customer_new_conversation = 1;
      bool customer_messages         = 2;
      bool group_messages            = 3;
      bool group_mentions            = 4;
      bool group_membership          = 5;
      bool direct_messages           = 6;
      bool group_reactions           = 7;
      bool direct_message_reactions  = 8;
    }
  }
}

message UpdateNotificationPreferencesReply {
  NotificationPreferences preferences = 1;
}

enum NotificationMuteTarget {
  NOTIFICATION_MUTE_TARGET_UNSPECIFIED    = 0;
  NOTIFICATION_MUTE_TARGET_CONVERSATION   = 1;
  NOTIFICATION_MUTE_TARGET_GROUP          = 2;
  NOTIFICATION_MUTE_TARGET_DIRECT_THREAD  = 3;
}

message NotificationMute {
  NotificationMuteTarget target_type = 1;
  int64 target_id                    = 2 [(validate.rules).int64 = { gt: 0 }];
  google.protobuf.Timestamp created_at = 3;
}

message SetNotificationMuteRequest {
  NotificationMuteTarget target_type = 1 [(validate.rules).enum = { defined_only: true,
                                                                    not_in: [ 0 ] }];
  int64 target_id                    = 2 [(validate.rules).int64 = { gt: 0 }];
  bool muted                         = 3;
}

message SetNotificationMuteReply {
  // Present when muted=true; empty when unmuted.
  NotificationMute mute = 1;
}

message ListNotificationMutesRequest {}

message ListNotificationMutesReply {
  repeated NotificationMute mutes = 1;
}

// ── Link preview ──

message LinkPreview {
  string url         = 1 [(validate.rules).string = { min_len: 1, max_len: 2048, uri: true }];
  string title       = 2 [(validate.rules).string = { ignore_empty: true, max_len: 512 }];
  string description = 3 [(validate.rules).string = { ignore_empty: true, max_len: 512 }];
  string image_url   = 4 [(validate.rules).string = { ignore_empty: true, max_len: 2048, uri: true }];
  string site_name   = 5 [(validate.rules).string = { ignore_empty: true, max_len: 2048 }];
}

message PreviewLinkRequest {
  // url must be an absolute http or https URL. file://, javascript:, and other
  // schemes are rejected at the proto-validation layer before any fetch occurs.
  string url = 1 [(validate.rules).string = { min_len: 1, max_len: 2048, uri: true, pattern: "^https?://" }];
}

message PreviewLinkReply {
  LinkPreview        preview = 1;
  PreviewLinkResult  result  = 2;
}

enum PreviewLinkResult {
  PREVIEW_LINK_RESULT_UNSPECIFIED   = 0;
  PREVIEW_LINK_RESULT_OK            = 1;
  PREVIEW_LINK_RESULT_NO_METADATA   = 2;
  PREVIEW_LINK_RESULT_FETCH_FAILED  = 3;
}

// ── Message media gallery ──

// Client-supplied metadata for one uploaded file attachment. The upload
// pipeline stores bare URLs only, so senders pass the original name/size
// captured from the file picker; entries with URLs absent from `files` are
// dropped server-side.
message FileMeta {
  string url  = 1 [(validate.rules).string = { min_len: 1, max_len: 2048 }];
  string name = 2 [(validate.rules).string = { ignore_empty: true, max_len: 512 }];
  int64 size  = 3 [(validate.rules).int64 = { gte: 0 }];
}

enum MessageMediaType {
  MESSAGE_MEDIA_TYPE_UNSPECIFIED = 0;
  MESSAGE_MEDIA_TYPE_MEDIA       = 1;
  MESSAGE_MEDIA_TYPE_FILE        = 2;
  MESSAGE_MEDIA_TYPE_LINK        = 3;
}

message ListMessageMediaRequest {
  // Exactly one target is required.
  oneof target {
    int64 group_id  = 1;  // chat group (main channel + topics)
    int64 thread_id = 2;  // staff direct message thread
  }
  MessageMediaType media_type = 3 [(validate.rules).enum = { in: [1, 2, 3] }];
  int32 page_size             = 4;
  // Exclusive upper bound (message id < cursor); omit for the newest page.
  int64 before_message_id = 5;
  // Chat group targets only: omit or 0 = whole group (main channel + all topics);
  // > 0 = restrict to that topic.
  int64 topic_id = 6 [(validate.rules).int64 = { gte: 0 }];
  // Chat group targets only: restrict to main-channel messages (topic_id = 0 rows). Needed because topic_id = 0 in this API means "whole group". Mutually exclusive with topic_id > 0.
  bool main_channel_only = 7;
}

message MessageMediaItem {
  int64 message_id            = 1;
  MessageMediaType media_type = 2;
  string url                  = 3;
  // True when a MEDIA item is a video (clients render a play badge / use <video>).
  bool is_video                        = 4;
  int64 sender_user_id                 = 5;
  google.protobuf.Timestamp created_at = 6;
  // FILE items only — original name/size captured at send time; empty for
  // files sent by clients that predate FileMeta support.
  string file_name = 7;
  int64 file_size  = 8;
  // LINK items only — snapshot of the stored link preview matching this URL
  // (empty when the message was sent without a preview) plus the message
  // text, so clients can render Telegram-style link cards without extra requests.
  string link_title       = 9;
  string link_description = 10;
  string link_image_url   = 11;
  string message_content  = 12;
}

message ListMessageMediaReply {
  // Newest message first; items within one message keep their stored order.
  repeated MessageMediaItem items = 1;
  // True when more items exist below min(returned.message_id).
  bool has_older = 2;
}

message GetMessageMediaCountsRequest {
  // Exactly one target is required.
  oneof target {
    int64 group_id  = 1;
    int64 thread_id = 2;
  }
  // Chat group targets only: omit or 0 = whole group; > 0 = restrict to that topic.
  int64 topic_id = 3 [(validate.rules).int64 = { gte: 0 }];
  // Chat group targets only: restrict to main-channel messages (topic_id = 0 rows). Mutually exclusive with topic_id > 0.
  bool main_channel_only = 4;
}

message GetMessageMediaCountsReply {
  // Counts are messages containing at least one item of the type (not item totals).
  int64 media_count = 1;
  int64 file_count  = 2;
  int64 link_count  = 3;
}

// ── Forward / shared message ──

message ChatGroupMessageRef {
  int64 group_id   = 1 [(validate.rules).int64 = { gt: 0 }];
  int64 topic_id   = 2 [(validate.rules).int64 = { gte: 0 }];
  int64 message_id = 3 [(validate.rules).int64 = { gt: 0 }];
}

message DirectMessageRef {
  int64 thread_id  = 1 [(validate.rules).int64 = { gt: 0 }];
  int64 message_id = 2 [(validate.rules).int64 = { gt: 0 }];
}

message CustomerMessageRef {
  int64 conversation_id = 1 [(validate.rules).int64 = { gt: 0 }];
  int64 message_id      = 2 [(validate.rules).int64 = { gt: 0 }];
}

message ChatGroupAudience {
  int64 group_id = 1 [(validate.rules).int64 = { gt: 0 }];
  // Optional; ACL uses group membership, not topic.
  int64 topic_id = 2 [(validate.rules).int64 = { gte: 0 }];
}

message ShareMessageRequest {
  oneof source {
    option (validate.required) = true;
    ChatGroupMessageRef group   = 1;
    DirectMessageRef dm         = 2;
    CustomerMessageRef customer = 3;
  }
  oneof audience {
    option (validate.required) = true;
    int64 user_id                   = 10 [(validate.rules).int64 = { gt: 0 }];
    ChatGroupAudience audience_group = 11;
  }
}

message ShareMessageReply {
  string hash = 1;
}

message GetSharedMessageRequest {
  string hash = 1 [(validate.rules).string = { min_len: 1, max_len: 64 }];
}

// Frozen forward-card payload (independent of source table).
message SharedMessageSnapshot {
  string content                 = 1;
  repeated string images         = 2;
  repeated string videos         = 3;
  repeated string files          = 4;
  repeated string audios         = 5;
  int64 sticker_id               = 6;
  string sticker_url             = 7;
  int64 sender_user_id           = 8;
  string sender_username         = 9;
  string source_kind             = 10; // GROUP | DM | CUSTOMER
  string source_name             = 11;
  int64 source_message_id        = 12;
  google.protobuf.Timestamp source_created_at = 13;
  // Location for FE "open original" (also on shared_messages row; echoed here for clients).
  int64 source_group_id          = 14;
  int64 source_topic_id          = 15;
  int64 source_thread_id         = 16;
  int64 source_conversation_id   = 17;
  // Telegram GIFs (often mp4); kept separate from videos.
  repeated string gifs           = 18;
  // Telegram voice notes (ogg/opus); distinct from generic audios.
  repeated string voices         = 19;
  // Telegram sticker URLs (customer CS); group/DM still use sticker_id/url.
  repeated string stickers       = 20;
  // >0 when source was a chat reply-thread message (group/DM). FE open-original
  // must jump to this root + open the thread — List*Messages excludes replies.
  int64 source_message_thread_root_id = 21;
}

message GetSharedMessageReply {
  SharedMessageSnapshot snapshot              = 1;
  int64 shared_by_user_id                     = 2;
  google.protobuf.Timestamp created_at        = 3;
}

// ── Save for later ────────────────────────────────────────────────────────────

enum SavedMessageSourceKind {
  SAVED_MESSAGE_SOURCE_KIND_UNSPECIFIED = 0;
  SAVED_MESSAGE_SOURCE_KIND_GROUP       = 1;
  SAVED_MESSAGE_SOURCE_KIND_DM          = 2;
}

enum SavedMessageStatus {
  SAVED_MESSAGE_STATUS_UNSPECIFIED = 0;
  SAVED_MESSAGE_STATUS_IN_PROGRESS = 1;
  SAVED_MESSAGE_STATUS_ARCHIVED    = 2;
  SAVED_MESSAGE_STATUS_COMPLETED   = 3;
}

message SetMessageSavedRequest {
  SavedMessageSourceKind source_kind = 1 [(validate.rules).enum = { defined_only: true, not_in: [0] }];
  int64 message_id                   = 2 [(validate.rules).int64 = { gt: 0 }];
  bool saved                         = 3;
}

message SetMessageSavedReply {
  // Present when saved=true and the row exists after the call; empty after unsave.
  SavedMessageHit hit = 1;
}

message UpdateSavedMessageStatusRequest {
  SavedMessageSourceKind source_kind = 1 [(validate.rules).enum = { defined_only: true, not_in: [0] }];
  int64 message_id                   = 2 [(validate.rules).int64 = { gt: 0 }];
  SavedMessageStatus status          = 3 [(validate.rules).enum = { defined_only: true, not_in: [0] }];
}

message UpdateSavedMessageStatusReply {
  SavedMessageHit hit = 1;
}

message ListSavedMessagesRequest {
  // Required status tab filter (one of IN_PROGRESS / ARCHIVED / COMPLETED).
  SavedMessageStatus status = 1 [(validate.rules).enum = { defined_only: true, not_in: [0] }];
  int32 page_size           = 2;
  // Opaque keyset cursor from the prior reply; omit for the first page.
  bytes next_cursor = 3;
}

// One Later row hydrated with live message content + room/thread context for FE headers.
message SavedMessageHit {
  int64 id                            = 1;
  SavedMessageStatus status           = 2;
  google.protobuf.Timestamp saved_at  = 3;
  oneof message {
    ChatGroupMessageInfo group_message = 4;
    DirectMessageInfo direct_message   = 5;
  }
  // Group context when source is GROUP (topic empty for main channel).
  ChatGroupInfo group       = 6;
  ChatGroupTopicInfo topic  = 7;
  // DM thread context when source is DM (peer may be unenriched).
  DirectMessageThreadInfo thread = 8;
}

// Accessible Later rows per status tab (same visibility rules as List for that tab).
// Counts are across all statuses, not limited to ListSavedMessagesRequest.status.
message SavedMessageStatusCounts {
  int64 in_progress = 1;
  int64 archived    = 2;
  int64 completed   = 3;
}

message ListSavedMessagesReply {
  repeated SavedMessageHit hits = 1;
  int32 page_size               = 2;
  // Empty when there are no more rows; pass back as next_cursor for the following page.
  bytes next_cursor = 3;
  // Access-filtered totals for all three tabs (including zeros). Present on every reply,
  // including cursor pages — not scoped to request.status.
  SavedMessageStatusCounts counts = 4;
}

// ── Sidebar sections ──────────────────────────────────────────────────────────
// Google Chat–style named sections that organise groups and DM threads in the
// staff sidebar. System sections (CUSTOMER, GROUP, DIRECT) are auto-provisioned;
// only CUSTOM sections may be created, renamed, or deleted by callers.

// Discriminates system-managed sections from user-created ones.
enum SidebarSectionKind {
  SIDEBAR_SECTION_KIND_UNSPECIFIED = 0;
  // System section header only: customer inbox stays on ListConversations (not movable here).
  SIDEBAR_SECTION_KIND_CUSTOMER = 1;
  // System section: staff chat groups (ChatGroup).
  SIDEBAR_SECTION_KIND_GROUP = 2;
  // System section: staff direct message threads (DirectMessageThread).
  SIDEBAR_SECTION_KIND_DIRECT = 3;
  // User-created section that may contain both groups and DM threads.
  SIDEBAR_SECTION_KIND_CUSTOM = 4;
}

// Controls the section filter applied by ListMyChatGroups / ListMyDirectMessages.
enum SidebarListScope {
  // No section filter — return all items regardless of section membership.
  // UNSPECIFIED is intentionally treated as ALL so existing clients are unaffected.
  SIDEBAR_LIST_SCOPE_UNSPECIFIED = 0;
  // Return only items not assigned to any CUSTOM section (section_id IS NULL / 0).
  SIDEBAR_LIST_SCOPE_DEFAULT = 1;
}

// Target type discriminator for MoveSidebarItem.
enum SidebarItemTargetType {
  SIDEBAR_ITEM_TARGET_TYPE_UNSPECIFIED    = 0;
  SIDEBAR_ITEM_TARGET_TYPE_GROUP         = 1;
  SIDEBAR_ITEM_TARGET_TYPE_DIRECT_THREAD = 2;
}

// A single sidebar section as returned by ListSidebarSections.
message SidebarSection {
  int64 id                    = 1;
  SidebarSectionKind kind     = 2;
  // Display name for CUSTOM; empty/ignored for system kinds (FE localizes).
  string name                 = 3;
  // 0-based display order within the caller's sidebar.
  int32 position              = 4;
}

// ── ListSidebarSections ──

message ListSidebarSectionsRequest {}

message ListSidebarSectionsReply {
  // All sections for the caller in ascending position order.
  // System sections (CUSTOMER / GROUP / DIRECT) are provisioned on first call.
  repeated SidebarSection sections = 1;
}

// ── CreateSidebarSection ──

message CreateSidebarSectionRequest {
  // Display name for the new section (CUSTOM kind only).
  string name = 1 [(validate.rules).string = { min_len: 1, max_len: 64 }];
}

message CreateSidebarSectionReply {
  SidebarSection section = 1;
}

// ── UpdateSidebarSection ──

message UpdateSidebarSectionRequest {
  // Must reference a CUSTOM section owned by the caller.
  int64 id   = 1 [(validate.rules).int64 = { gt: 0 }];
  // New display name.
  string name = 2 [(validate.rules).string = { min_len: 1, max_len: 64 }];
}

message UpdateSidebarSectionReply {
  SidebarSection section = 1;
}

// ── DeleteSidebarSection ──

message DeleteSidebarSectionRequest {
  // Must reference a CUSTOM section owned by the caller.
  int64 id = 1 [(validate.rules).int64 = { gt: 0 }];
}

message DeleteSidebarSectionReply {}

// ── ReorderSidebarSections ──

message ReorderSidebarSectionsRequest {
  // Complete ordered list of ALL section ids for the caller (system + custom).
  // Missing or extra ids are rejected.
  repeated int64 section_ids = 1 [(validate.rules).repeated = { min_items: 1, max_items: 200,
                                                                 items: { int64: { gt: 0 } } }];
}

message ReorderSidebarSectionsReply {
  // Updated sections in the new position order.
  repeated SidebarSection sections = 1;
}

// ── MoveSidebarItem ──

message MoveSidebarItemRequest {
  SidebarItemTargetType target_type = 1 [(validate.rules).enum = { defined_only: true,
                                                                    not_in: [ 0 ] }];
  // Id of the group or DM thread to move.
  int64 target_id = 2 [(validate.rules).int64 = { gt: 0 }];
  // Destination CUSTOM section id, or 0 to clear placement (return to system GROUP/DIRECT).
  int64 section_id = 3 [(validate.rules).int64 = { gte: 0 }];
}

message MoveSidebarItemReply {}

// ── ListSidebarSectionItems ──

// A single entry in a CUSTOM sidebar section — either a chat group or a DM thread.
// Exactly one of `group` or `dm` is set.
message SidebarSectionItem {
  oneof item {
    MyChatGroupInfo          group = 1;
    DirectMessageThreadInfo  dm    = 2;
  }
}

message ListSidebarSectionItemsRequest {
  // Must reference a CUSTOM section owned by the caller.
  int64 section_id = 1 [(validate.rules).int64 = { gt: 0 }];
  int32 page_size  = 2;
  int32 page       = 3;
}

message ListSidebarSectionItemsReply {
  // Pinned items first (pinned_at DESC), then by last_message_at DESC.
  // Items from groups and DM threads are merge-sorted under this ordering.
  repeated SidebarSectionItem items = 1;
  int32 page_size                   = 2;
  int32 page                        = 3;
  int64 count                       = 4;
}

// ── ListHomeFeed ──

enum HomeFeedItemKind {
  HOME_FEED_ITEM_KIND_UNSPECIFIED            = 0;
  HOME_FEED_ITEM_KIND_GROUP_TOPIC            = 1;
  HOME_FEED_ITEM_KIND_GROUP_THREAD           = 2;
  HOME_FEED_ITEM_KIND_DIRECT_MESSAGE         = 3;
  HOME_FEED_ITEM_KIND_DIRECT_MESSAGE_THREAD  = 4;
  HOME_FEED_ITEM_KIND_CONVERSATION           = 5;
}

message ListHomeFeedRequest {
  // Default 50, max 100.
  int32 page_size = 1;
  // When true, only entities with unread_count > 0 for the caller.
  bool unread_only = 2;
  // Keyset cursor from last item of previous page (all unset = first page).
  google.protobuf.Timestamp before_activity_at = 3;
  HomeFeedItemKind before_kind                 = 4;
  // Stable tie-break from HomeFeedItem.id of the previous page's last item.
  int64 before_id = 5;
}

message ListHomeFeedReply {
  repeated HomeFeedItem items = 1;
  int32 page_size             = 2;
  bool has_more               = 3;
}

message HomeFeedItem {
  HomeFeedItemKind kind                     = 1;
  google.protobuf.Timestamp last_activity_at = 2;
  int64 unread_count                        = 3;
  // Opaque stable tie-break for keyset pagination; pass back as before_id.
  // GROUP_TOPIC main channel uses -group_id; custom topic uses topic_id;
  // GROUP_THREAD / DIRECT_MESSAGE_THREAD use root_message_id;
  // DIRECT_MESSAGE uses thread_id; CONVERSATION uses conversation_id.
  int64 id = 4;
  oneof payload {
    HomeFeedGroupTopic group_topic                       = 10;
    HomeFeedGroupThread group_thread                     = 11;
    HomeFeedDirectMessage direct_message                 = 12;
    HomeFeedDirectMessageThread direct_message_thread    = 13;
    HomeFeedConversation conversation                    = 14;
  }
}

message HomeFeedGroupTopic {
  int64 group_id                   = 1;
  string group_name                = 2;
  // 0 = main channel.
  int64 topic_id                   = 3;
  string topic_name                = 4;
  ChatGroupMessageInfo last_message = 5;
}

message HomeFeedGroupThread {
  int64 group_id                    = 1;
  string group_name                 = 2;
  int64 topic_id                    = 3;
  ChatGroupMessageInfo root_message = 4;
  ChatGroupMessageInfo last_reply   = 5;
  MessageThreadSummary thread       = 6;
}

message HomeFeedDirectMessage {
  int64 thread_id             = 1;
  DirectMessagePeerInfo peer  = 2;
  DirectMessageInfo last_message = 3;
}

message HomeFeedDirectMessageThread {
  int64 thread_id                = 1;
  DirectMessagePeerInfo peer     = 2;
  DirectMessageInfo root_message = 3;
  DirectMessageInfo last_reply   = 4;
  MessageThreadSummary thread    = 5;
}

message HomeFeedConversation {
  ConversationInfo conversation = 1;
}

// ── ListMyThreads ──

enum MyThreadKind {
  MY_THREAD_KIND_UNSPECIFIED    = 0;
  MY_THREAD_KIND_GROUP          = 1;
  MY_THREAD_KIND_DIRECT_MESSAGE = 2;
}

message ListMyThreadsRequest {
  // Default 50, max 100.
  int32 page_size = 1;
  // When true, only threads with unread_count > 0 for the caller.
  bool unread_only = 2;
  // Recent replies per card (excludes root). Default 2, max 5.
  int32 recent_reply_count = 3;
  // Keyset cursor from last item of previous page (all unset = first page).
  google.protobuf.Timestamp before_activity_at = 4;
  MyThreadKind before_kind                     = 5;
  // Stable tie-break from MyThreadItem.root_message_id of the previous page's last item.
  int64 before_root_message_id = 6;
}

message ListMyThreadsReply {
  repeated MyThreadItem items = 1;
  int32 page_size             = 2;
  bool has_more               = 3;
}

message MyThreadItem {
  MyThreadKind kind                      = 1;
  google.protobuf.Timestamp last_activity_at = 2;
  int64 unread_count                     = 3;
  int64 root_message_id                  = 4;
  oneof payload {
    MyThreadGroupItem group                 = 10;
    MyThreadDirectMessageItem direct_message = 11;
  }
}

message MyThreadGroupItem {
  int64 group_id   = 1;
  string group_name = 2;
  // 0 = General.
  int64 topic_id   = 3;
  // Empty when topic_id = 0.
  string topic_name = 4;
  ChatGroupMessageInfo root_message = 5;
  // Oldest-first.
  repeated ChatGroupMessageInfo recent_replies = 6;
  // reply_count - len(recent_replies); FE → "Show N more replies".
  int64 hidden_reply_count = 7;
  MessageThreadSummary thread = 8;
  // Max 5, for "A, B, and you".
  repeated MyThreadParticipant participants = 9;
}

message MyThreadDirectMessageItem {
  int64 thread_id = 1;
  DirectMessagePeerInfo peer = 2;
  DirectMessageInfo root_message = 3;
  repeated DirectMessageInfo recent_replies = 4;
  int64 hidden_reply_count = 5;
  MessageThreadSummary thread = 6;
}

message MyThreadParticipant {
  int64 user_id      = 1;
  string display_name = 2;
  string avatar_url  = 3;
}
